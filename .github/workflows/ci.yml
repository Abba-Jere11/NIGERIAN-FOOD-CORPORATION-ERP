name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nfc_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      minio:
        image: bitnami/minio:2025.4.22
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      NODE_ENV: test
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: nfc_erp_dev
      PGDATABASE_TEST: nfc_erp_test
      APP_DB_USER: nfc_app
      # Throwaway credential for a throwaway database inside the job.
      APP_DB_PASSWORD: nfc_app_ci
      SESSION_SECRET: ci-nfc-session-secret-not-for-production-use
      MFA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SEED_USER_PASSWORD: 'NFC-Demo-Seed-2026!'
      SEED_E2E_SKIP_MUST_CHANGE: 'true'
      HIBP_ENABLED: 'false'
      JOBS_ENABLED: 'true'
      WEB_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: nfc-documents
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: 'true'
      DOCUMENT_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SEAL_SIGNING_KEYS: '{"v1":"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef","v2":"fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210"}'
      SEAL_ACTIVE_KID: v1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: No role-name branches in apps
        run: node scripts/check-no-role-branch.mjs

      - name: API route guard inventory
        run: node scripts/check-api-guards.mjs

      - name: Dependency audit (high, non-blocking)
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Lint
        run: pnpm lint

      - name: Build workspace packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # Proves the acceptance line "migrations and seed run from scratch": the
      # service container starts empty every time.
      - name: Bootstrap, migrate and seed
        run: pnpm db:bootstrap && pnpm db:migrate && pnpm db:seed

      - name: Unit and integration tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm --filter @nfc/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload the Playwright report when the end-to-end tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
